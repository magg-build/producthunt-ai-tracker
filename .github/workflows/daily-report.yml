name: Product Hunt AI Daily Report

on:
  schedule:
    # 每天早上6点运行 (UTC 22:00，北京时间6:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: '榜单类型 (daily/weekly/monthly/yearly)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'daily'
          - 'weekly'
          - 'monthly'
          - 'yearly'

jobs:
  generate-report:
    runs-on: ubuntu-latest
    outputs:
      report_file: ${{ steps.run_tracker.outputs.report_file }}
      period: ${{ steps.run_tracker.outputs.period }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Run tracker
      id: run_tracker
      env:
        PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
      run: |
        if [ -n "${{ github.event.inputs.period }}" ]; then
          python scripts/tracker.py ${{ github.event.inputs.period }}
          echo "period=${{ github.event.inputs.period }}" >> $GITHUB_OUTPUT
        else
          python scripts/tracker.py
          # 检测使用的榜单类型
          if ls data/PH-AI-weekly-*.md 1> /dev/null 2>&1; then
            echo "period=weekly" >> $GITHUB_OUTPUT
          else
            echo "period=daily" >> $GITHUB_OUTPUT
          fi
        fi
        # 获取生成的文件名
        REPORT_FILE=$(ls -t data/PH-AI-*.md | head -1)
        echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
        echo "Generated: $REPORT_FILE"
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --staged --quiet || git commit -m "📊 Update Product Hunt AI Report - $(date +%Y-%m-%d)"
        git push
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ph-ai-report-${{ github.run_id }}
        path: data/*.md
        retention-days: 30

  # 推送到飞书
  notify-feishu:
    needs: generate-report
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ph-ai-report-${{ github.run_id }}
        path: data/
    
    - name: Send to Feishu
      env:
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      run: |
        if [ -n "$FEISHU_WEBHOOK_URL" ]; then
          echo "Sending to Feishu..."
          python scripts/feishu_notifier.py
        else
          echo "FEISHU_WEBHOOK_URL not set, skipping notification"
        fi
